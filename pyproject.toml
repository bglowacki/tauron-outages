[project]
name = "tauron-outages"
version = "1.4.0"
description = "Home Assistant integration for Tauron Dystrybucja power outages"
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = [
    "homeassistant>=2026.11.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-homeassistant-custom-component>=0.13.375,<0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "custom_components"]
addopts = ["-p", "homeassistant.const", "-p", "no:homeassistant"]
asyncio_mode = "auto"

[tool.uv]
override-dependencies = ["homeassistant==2026.11.1"]
