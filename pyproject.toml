[project]
name = "tauron-outages"
version = "0.1.0"
description = "Home Assistant integration for Tauron Dystrybucja power outages"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "homeassistant>=2025.4.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["custom_components/tauron_outages"]
